<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAL montaža</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e6e1;font-family:Arial,Helvetica,sans-serif;color:#111}
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.panel{background:#1a1a2e;color:#fff;padding:16px 14px 40px;overflow-y:auto;max-height:100vh}
.panel h1{font-size:18px}
.sub{color:#c9c9d4;font-size:12px;margin:4px 0 12px}
label{display:block;font-size:10px;color:#c9c9d4;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #3a3a55;background:#121225;color:#fff;border-radius:4px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item{background:#121225;border:1px solid #3a3a55;border-radius:6px;padding:8px;margin-top:8px}
.item .hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#c9c9d4;margin-bottom:4px}
.ok{color:#9fdfb3;font-size:11px;margin-top:4px}
.btn{border:0;cursor:pointer;border-radius:5px;padding:9px 12px;font-weight:700;font-size:13px}
.btn-red{background:#c41e3a;color:#fff;width:100%;margin-top:10px}
.btn-g{background:#2d6a4f;color:#fff;width:100%;margin-top:8px}
.btn-x{background:transparent;color:#fff;border:1px solid #555;padding:4px 8px;font-size:11px}
.btn-del{background:#7a1f2e;color:#fff;border:0;padding:4px 8px;font-size:11px;border-radius:4px;cursor:pointer}
.rad{background:#121225;border:1px solid #3a3a55;border-radius:6px;padding:8px;margin-top:6px}
.rad label.chk{display:flex;align-items:center;gap:8px;text-transform:none;font-size:12px;color:#eee;margin:0 0 6px;letter-spacing:0}
.rad input[type=checkbox]{width:auto}
.preview{padding:16px;display:flex;justify-content:center}
.sheet{width:210mm;min-height:297mm;background:#fff;padding:10mm 14mm 12mm;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.memo{margin-bottom:18mm}
.memo img{width:100%;height:auto;display:block}
.top{display:grid;grid-template-columns:1fr 77mm;gap:8mm;align-items:start}
.sheet h2{font-size:22px}
.tl{font-size:11px;margin-top:5px;color:#c41e3a;font-weight:700}
.kupac{margin-top:10px;font-size:11px}
.meta{border:.5px solid #aaa;font-size:8.5px}
.meta div{display:grid;grid-template-columns:28mm 1fr;border-bottom:.5px solid #aaa;padding:4px 6px}
.meta div:last-child{border-bottom:0}
table.stavke{width:100%;border-collapse:collapse;margin-top:6mm;font-size:8.5px}
table.stavke th{background:#1a1a2e;color:#fff;text-align:left;padding:5px 4px;font-size:7.5px}
table.stavke td{padding:6px 4px;border-bottom:1px solid #e6e6e6;vertical-align:top}
table.stavke tr:nth-child(even) td{background:#f5f5f5}
.r{text-align:right}.c{text-align:center}
.totals{width:88mm;margin:5mm 0 0 auto;border:.5px solid #888;font-size:10px}
.totals div{display:flex;justify-content:space-between;padding:3.5px 8px}
.grand{background:#c41e3a;color:#fff;font-weight:700}
.nap{margin-top:7mm;font-size:9px;line-height:1.45}
.nap b{color:#c41e3a;display:block;margin-bottom:2px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:6mm}
.box{border:.5px solid #aaa;padding:7px 10px;min-height:20mm;font-size:9px}
.big{color:#c41e3a;font-size:16px;font-weight:700;margin:4px 0}
.iban{color:#c41e3a;font-size:12px;font-weight:700;margin:4px 0}
.sign{margin-top:8mm;font-size:9px}
@page{size:A4;margin:8mm}
@media print{
  html,body{background:#fff!important}
  .panel{display:none!important}
  .app{display:block}
  .preview{padding:0}
  .sheet{box-shadow:none;width:auto;min-height:auto;padding:0}
}
@media(max-width:980px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
  <h1>RAL MONTAŽA</h1>
  <p class="sub">Obračun po dužnim metrima · cijene upisuješ sam</p>
  <label>Broj ponude</label>
  <div class="row2">
    <input id="broj" />
    <button class="btn btn-x" onclick="noviBroj()">Novi broj</button>
  </div>
  <button class="btn btn-red" style="margin-top:8px" onclick="novaPonuda()">Nova ponuda</button>
  <label>Kupac</label>
  <input id="kupac" placeholder="Ime / firma" oninput="render()" />
  <label>Mjesto</label>
  <input id="grad" value="20000 DUBROVNIK" oninput="render()" />
  <div class="row2">
    <div><label>Datum</label><input id="datum" oninput="render()" /></div>
    <div><label>Valjanost</label><input id="valjanost" value="15 dana" oninput="render()" /></div>
  </div>
  <label>Rok / plaćanje</label>
  <input id="isporuka" value="po dogovoru" oninput="render()" />
  <input id="placanje" value="70% avans, ostatak nakon ugradnje" oninput="render()" style="margin-top:6px" />

  <label>1. Upload ponude (PDF ili slika)</label>
  <input id="prilog" type="file" accept="image/*,.pdf" onchange="citajDokument(this)" />
  <div class="ok" id="prilogInfo">Kad učitaš ponudu, klikni rad dolje — izlaze dužni metri.</div>
  <details style="margin-top:8px">
    <summary style="color:#c9c9d4;font-size:12px;cursor:pointer">Ručni unos / zalijepi tekst</summary>
    <textarea id="bulk" rows="4" placeholder="123x146 prozor&#10;146x235 balkon" style="margin-top:6px"></textarea>
    <button class="btn btn-g" onclick="ucitajBulk()">Učitaj iz teksta</button>
  </details>

  <label>Otvori</label>
  <div id="otvori"></div>
  <button class="btn btn-g" onclick="dodaj()">+ Dodaj otvor ručno</button>

  <label style="margin-top:14px">Radovi i cijena € / dužni metar</label>
  <div id="radovi"></div>

  <label>Napomena</label>
  <textarea id="napomena" rows="3" oninput="render()"></textarea>
  <button class="btn btn-red" onclick="window.print()">Print / PDF</button>
</aside>
<div class="preview"><div class="sheet" id="sheet"></div></div>
</div>

function nextBroj(){
  const d=new Date();
  const p="R-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const k="ral-broj-"+p;
  let n=1;
  try{ n=parseInt(localStorage.getItem(k)||"0",10)+1; localStorage.setItem(k,String(n)); }catch(e){}

}
function fmt(n){ return Number(n).toLocaleString("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

function m(cm){ return (Number(cm)||0)/100; }

function metara(rad, lista){
  const f = rad.filter;
  return lista.reduce((s,o)=>{
    if(f==="prozor" && o.tip!=="prozor") return s;
    if(f==="balkon" && o.tip!=="balkon") return s;
    const k = Number(o.kom)||0;
    const w = m(o.sirina), h = m(o.visina);
    if(rad.baza==="opseg") return s + k * 2 * (w+h);
    return s + k * (w + (rad.plus||0));
  },0);
}


function ucitajBulk(){
  const txt = (document.getElementById("bulk").value||"").trim();
  if(!txt) return;
  const novi = [];
  txt.split(/\n+/).forEach(line=>{
    const s = line.trim().toLowerCase().replace(/,/g,".").replace(/×/g,"x").replace(/х/g,"x");
    const m = s.match(/(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)/);
    if(!m) return;
    let kom = 1;
    const km = s.match(/(\d+)\s*kom/);
    if(km) kom = Number(km[1]);
    const tip = /(balkon|terasa|do\s*poda|vrat)/.test(s) ? "balkon" : "prozor";
    const naziv = line.replace(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)/i,"").replace(/\d+\s*kom/i,"").trim();
    novi.push({naziv: naziv||"", sirina: String(Math.round(Number(m[1]))), visina: String(Math.round(Number(m[2]))), kom: String(kom), tip});
  });
  if(!novi.length){ alert("Nisam našao dimenzije. Primjer: 123x146 prozor"); return; }
  otvori = novi;
  paint(); render();
}

function normDim(a,b){
  let w=Number(String(a).replace(",",".")), h=Number(String(b).replace(",","."));
  if(w<=4 && h<=4){ w*=100; h*=100; } // metri -> cm
  return {w: Math.round(w), h: Math.round(h)};
}
function parsajTekst(txt){
  const raw = String(txt||"").replace(/\u00a0/g," ");
  const blob = raw.replace(/(\d)\s+([x×х\*\/])\s+(\d)/gi,"$1$2$3");
  const found = [];
  const seen = new Set();
  const re = /(\d{2,4}(?:[.,]\d+)?)\s*(?:x|×|х|\*|\/)\s*(\d{2,4}(?:[.,]\d+)?)/ig;
  let m;
  while((m = re.exec(blob))){
    let w = Number(String(m[1]).replace(",","."));
    let h = Number(String(m[2]).replace(",","."));
    if(w<=4 && h<=4){ w*=100; h*=100; }
    if(w>400 && h>400){ w/=10; h/=10; } // mm -> cm
    w = Math.round(w); h = Math.round(h);
    if(w<40 || h<40 || w>300 || h>300) continue;
    const around = blob.slice(Math.max(0,m.index-100), m.index+120).toLowerCase();
    const tip = /(balkon|terasa|do\s*poda|balkonsk|hst|ulazna)/.test(around) ? "balkon" : "prozor";
    let kom = 1;
    const km = around.match(/(\d+)\s*(?:kom|komada)/);
    if(km) kom = Number(km[1])||1;
    const key = w+"x"+h+"|"+tip+"|"+kom;
    if(seen.has(key)) continue;
    seen.add(key);
    found.push({naziv: w+"×"+h+" cm", sirina:String(w), visina:String(h), kom:String(kom), tip});
  }
  return found;
}

async function pdfTekst(file){
  if(!window.pdfjsLib) throw new Error("PDF čitač nije učitan");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = "";
  const canvases = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    text += c.items.map(x=>x.str).join(" ") + "\n";
    const vp = page.getViewport({scale: 1.6});
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
    canvases.push(canvas);
  }
  return {text, canvases};
}

async function ocrCanvas(canvas){
  if(!window.Tesseract) return "";
  const { data } = await Tesseract.recognize(canvas, "eng", { logger:()=>{} });
  return data.text||"";
}

async function citajDokument(el){
  const f = el.files && el.files[0];
  if(!f){ prilogURL=""; prilogIme=""; render(); return; }
  prilogIme = f.name;
  info("Čitam dokument…");
  try{
    let text = "";
    if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
      const {text: t0, canvases} = await pdfTekst(f);
      text = t0;
      if(parsajTekst(text).length===0 && canvases[0]){
        info("Nema teksta u PDF-u, čitam sliku (OCR)…");
        for(const c of canvases){ text += "\n" + await ocrCanvas(c); }
      }
      if(canvases[0]) prilogURL = canvases[0].toDataURL("image/jpeg", 0.7);
    } else {
      const url = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
      prilogURL = url;
      info("Čitam sliku (OCR)… ovo traje 10–30 sekundi");
      const img = new Image();
      await new Promise(res=>{ img.onload=res; img.src=url; });
      const canvas = document.createElement("canvas");
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext("2d").drawImage(img,0,0);
      text = await ocrCanvas(canvas);
    }
    const found = parsajTekst(text);
    if(!found.length){
      info("Nisam našao dimenzije (npr. 123x146). Provjeri je li ponuda čitka ili zalijepi dimenzije.");
      render();
      return;
    }
    otvori = found;
    paint(); render();
    info("Pronađeno otvora: "+found.length+". Provjeri vrstu (prozor/balkon) i cijene.");
  }catch(e){
    info("Greška pri čitanju: "+(e.message||e));
  }
}

      <input type="number" step="0.01" value="${c}" oninput="cijene['${r.id}']=this.value;render()">
    </div>`;
  }).join("");
}

function render(){
  const lista = otvori.filter(o => Number(o.sirina)>0 && Number(o.visina)>0);
  const rows = [];
  RADOVI.forEach(r=>{
    if(!ukljuceno[r.id]) return;
    const dm = metara(r, lista);
    const cij = Number(cijene[r.id])||0;
    rows.push({naziv:r.naziv, opis:r.opis, dm, cij, uk: +(dm*cij).toFixed(2)});
  });
  const sub = +rows.reduce((a,x)=>a+x.uk,0).toFixed(2);
  const pdv = +(sub*0.25).toFixed(2);
  const tot = +(sub+pdv).toFixed(2);
  const av = +(tot*0.7).toFixed(2);
  const os = +(tot-av).toFixed(2);

  const pregledOtvora = lista.length ? `<table class="stavke"><thead><tr>
    <th>R.BR.</th><th>OTVOR</th><th>VRSTA</th><th>DIMENZIJA</th><th class="c">KOM</th><th class="r">OPSEG m'</th><th class="r">DONJA BAZA m'</th>
  </tr></thead><tbody>${lista.map((o,i)=>{
    const w=m(o.sirina),h=m(o.visina),k=Number(o.kom)||0;
    return `<tr><td>${i+1}</td><td>${o.naziv||("Otvor "+(i+1))}</td>
      <td>${o.tip==="balkon"?"Balkon / do poda":"Prozor"}</td>
      <td>${o.sirina} × ${o.visina} cm</td><td class="c">${k}</td>
      <td class="r">${fmt(k*2*(w+h))}</td><td class="r">${fmt(k*w)}</td></tr>`;
  }).join("")}</tbody></table>` : "";

  document.getElementById("sheet").innerHTML = `
    <div class="memo"><img src="${LOGO}" alt="PORTAL"></div>
    <div class="top">
      <div>
        <h2>PONUDA</h2>
        <div class="tl">RAL montaža i prateći radovi</div>
        <div class="kupac"><b>Kupac / Naručitelj:</b>${val("kupac")||"________________"}<div>${val("grad")}</div></div>
      </div>
      <div class="meta">
        <div><span>BROJ PONUDE:</span><b>${val("broj")}</b></div>
        <div><span>DATUM:</span><b>${val("datum")}</b></div>
        <div><span>VALJANOST:</span><b>${val("valjanost")}</b></div>
        <div><span>ROK:</span><b>${val("isporuka")}</b></div>
        <div><span>PLAĆANJE:</span><b>${val("placanje")}</b></div>
      </div>
    </div>
    ${pregledOtvora}
    <table class="stavke">
      <thead><tr><th>R.BR.</th><th>OPIS RADA</th><th class="r">DUŽNI METRI</th><th class="r">CIJENA / m'</th><th class="r">UKUPNO</th></tr></thead>
      <tbody>
        ${rows.map((r,i)=>`<tr>
          <td>${i+1}</td>
          <td>${r.naziv}<div style="color:#555">${r.opis}</div></td>
          <td class="r">${fmt(r.dm)}</td>
          <td class="r">${fmt(r.cij)}</td>
          <td class="r">${fmt(r.uk)}</td>
        </tr>`).join("") || `<tr><td colspan="5">Nema uključenih radova ili dimenzija.</td></tr>`}
      </tbody>
    </table>
    <div class="totals">
      <div><span>UKUPNO bez PDV-a</span><b>${fmt(sub)} €</b></div>
      <div><span>PDV 25%</span><b>${fmt(pdv)} €</b></div>
      <div class="grand"><span>UKUPNO s PDV-om</span><span>${fmt(tot)} €</span></div>
    </div>
    <div class="nap">
      <b>NAPOMENE:</b>
      <div>• RAL montaža = opseg otvora (2 × širina + 2 × visina).</div>
      <div>• Izolacija podštokova = donja širina + 20 cm.</div>
      <div>• EPDM = donja baza širine otvora.</div>
      <div>• Podštokovi samo na otvorima do poda. ALU klupice samo na prozorima.</div>
      ${prilogIme?`<div>• Prilog: ${prilogIme}</div>`:""}
      ${prilogURL?`<div style="margin-top:6px"><img src="${prilogURL}" style="max-width:100%;max-height:70mm;border:0.5px solid #ccc"></div>`:""}
      ${val("napomena")?`<div>• ${val("napomena")}</div>`:""}
    </div>
    <div class="foot">
      <div class="box">Za naplatu:<div class="big">${fmt(tot)} €</div>
        <div>${val("placanje")}</div>
        ${val("placanje").toLowerCase().includes("70")?`<div>Avans ${fmt(av)} € · ostatak ${fmt(os)} €</div>`:""}
      </div>
      <div class="box">Plaćanje na račun kod RBA:<div class="iban">HR76 2484008 1105901607</div>
      PORTAL MONTAŽA &amp; SERVIS d.o.o.</div>
    </div>
    <div class="sign">POTPIS NARUČITELJA: _______________________ &nbsp;&nbsp; IZDAVATELJ: _______________________</div>
  `;
}

document.getElementById("datum").value = today();
document.getElementById("broj").value = nextBroj();
paint();
render();
</script>
</body>
</html>
