<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RAL montaža</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e8e6e1;color:#111}
.app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
.panel{background:#1a1a2e;color:#fff;padding:14px 12px 36px;overflow:auto;max-height:100vh}
h1{font-size:18px}
.sub{color:#c9c9d4;font-size:12px;margin:4px 0 12px}
label{display:block;font-size:10px;color:#c9c9d4;margin:8px 0 3px;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #3a3a55;background:#121225;color:#fff;border-radius:4px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:0;cursor:pointer;border-radius:5px;padding:9px 12px;font-weight:700}
.btn-red{background:#c41e3a;color:#fff;width:100%;margin-top:10px}
.btn-g{background:#2d6a4f;color:#fff;width:100%;margin-top:8px}
.btn-del{background:#7a1f2e;color:#fff;border:0;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.ok{color:#9fdfb3;font-size:12px;margin-top:4px}
.warn{color:#ffcc80;font-size:12px;margin-top:4px}
.rad{background:#121225;border:1px solid #3a3a55;border-radius:6px;padding:8px;margin-top:6px}
.rad label.chk{display:flex;gap:8px;align-items:flex-start;text-transform:none;font-size:12px;color:#eee;letter-spacing:0;margin:0 0 4px}
.rad input[type=checkbox]{width:auto;margin-top:2px}
.met{color:#fff;font-size:16px;font-weight:700;margin:4px 0}
.item{background:#121225;border:1px solid #3a3a55;border-radius:6px;padding:8px;margin-top:6px;font-size:12px}
.preview{padding:16px;display:flex;justify-content:center}
.sheet{width:210mm;min-height:297mm;background:#fff;padding:10mm 14mm;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.memo img{width:100%;display:block;margin-bottom:16mm}
.top{display:grid;grid-template-columns:1fr 77mm;gap:8mm}
h2{font-size:22px}
.tl{color:#c41e3a;font-size:11px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:5mm;font-size:8.5px}
th{background:#1a1a2e;color:#fff;text-align:left;padding:5px 4px}
td{padding:5px 4px;border-bottom:1px solid #e6e6e6}
.r{text-align:right}.c{text-align:center}
.totals{width:90mm;margin:5mm 0 0 auto;border:.5px solid #888;font-size:10px}
.totals div{display:flex;justify-content:space-between;padding:4px 8px}
.grand{background:#c41e3a;color:#fff;font-weight:700}
.nap{margin-top:6mm;font-size:9px;line-height:1.45}
@page{size:A4;margin:8mm}
@media print{.panel,.no-print{display:none!important}.app{display:block}.preview{padding:0}.sheet{box-shadow:none;width:auto;padding:0}}
@media(max-width:980px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
  <h1>RAL MONTAŽA</h1>
  <p class="sub">Upload ponude → klikni rad → upiši cijenu €/m′</p>

  <label>Kupac</label>
  <input id="kupac" oninput="crtaj()"/>
  <div class="row2">
    <div><label>Broj</label><input id="broj" oninput="crtaj()"/></div>
    <div><label>Datum</label><input id="datum" oninput="crtaj()"/></div>
  </div>

  <label>1. Ponuda ili skica (PDF / slika)</label>
  <input type="file" accept="application/pdf,image/*" onchange="ucitaj(this)"/>
  <div id="info" class="ok">Dimenzije su uvijek u mm.</div>

  <details class="no-print" style="margin-top:8px">
    <summary style="color:#c9c9d4;font-size:12px;cursor:pointer">Otvori (samo ako treba ispraviti)</summary>
    <div id="lista"></div>
    <button class="btn btn-g" onclick="dodaj()">+ Dodaj otvor ručno (mm)</button>
  </details>

  <label>2. Izbornik — kvačica ide u ponudu</label>
  <div id="radovi"></div>

  <button class="btn btn-red" onclick="window.print()">Print / PDF</button>
</aside>
<div class="preview"><div class="sheet" id="sheet"></div></div>
</div>

const RADOVI = [
  {id:"ral", naziv:"RAL montaža", kako:"Zbroj svih 4 strane svih otvora", tip:"svi", plus:0, baza:"opseg"},
  {id:"izolacija", naziv:"Izolacija podštokova (izolacija + betonska ploča)", kako:"Samo donja širina + 20 cm", tip:"svi", plus:0.20, baza:"donja"},
  {id:"epdm", naziv:"Ugradnja EPDM folije (priprema klupica)", kako:"Donja baza širine otvora", tip:"svi", plus:0, baza:"donja"},
  {id:"ps100", naziv:"Ugradnja podštokova širine 100 cm", kako:"Donja baza otvora do poda", tip:"pod", plus:0, baza:"donja"},
  {id:"ps6", naziv:"Ugradnja podštokova širine 6 cm", kako:"Donja baza otvora do poda", tip:"pod", plus:0, baza:"donja"},
  {id:"ps35", naziv:"Ugradnja podštokova širine 3,5 cm", kako:"Donja baza otvora do poda", tip:"pod", plus:0, baza:"donja"},
  {id:"ps15", naziv:"Ugradnja podštokova širine 1,5 cm", kako:"Donja baza otvora do poda", tip:"pod", plus:0, baza:"donja"},
  {id:"kl23", naziv:"Ugradnja ALU klupice razvijene širine 23 cm", kako:"Donja baza samo prozora", tip:"prozor", plus:0, baza:"donja"},
  {id:"kl21", naziv:"Ugradnja ALU klupice razvijene širine 21 cm", kako:"Donja baza samo prozora", tip:"prozor", plus:0, baza:"donja"},
  {id:"kl19", naziv:"Ugradnja ALU klupice razvijene širine 19 cm", kako:"Donja baza samo prozora", tip:"prozor", plus:0, baza:"donja"},
  {id:"kl15", naziv:"Ugradnja ALU klupice razvijene širine 15 cm", kako:"Donja baza samo prozora", tip:"prozor", plus:0, baza:"donja"}
];

let otvori = [];
let uklj = {ral:true, izolacija:false, epdm:false};
let cijena = {};

function danas(){
  const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()+".";
}
function fmt(n){ return Number(n||0).toLocaleString("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function v(id){ return document.getElementById(id).value; }

function metara(rad){
  return otvori.reduce((s,o)=>{
    if(rad.tip==="prozor" && o.tip!=="prozor") return s;
    if(rad.tip==="pod" && o.tip!=="pod") return s;
    const k = Number(o.kom)||0;
    const w = (Number(o.wmm)||0)/1000;
    const h = (Number(o.hmm)||0)/1000;
    if(rad.baza==="opseg") return s + k*2*(w+h);
    return s + k*(w + (rad.plus||0));
  },0);
}

function parsaj(txt){
  const blob = String(txt||"").replace(/\u00a0/g," ").replace(/,/g,".");
  const re = /(\d{3,4})\s*[x×]\s*(\d{3,4})\s*mm/ig;
  const out = [];
  let m;
  while((m = re.exec(blob))){
    const wmm = Number(m[1]), hmm = Number(m[2]);
    if(wmm<250 || hmm<250 || wmm>5000 || hmm>5000) continue;
    const around = blob.slice(Math.max(0,m.index-90), m.index+30).toLowerCase();
    const after = blob.slice(m.index, m.index+800);
    let kom = 1;
    const km = after.match(/(\d+(?:\.\d+)?)\s*kom/i);
    if(km) kom = Math.max(1, Math.round(Number(km[1])));
    const tip = /(vrata|balkon|do\s*poda)/.test(around) || hmm>=1800 ? "pod" : "prozor";
    const naziv = around.includes("vrata") ? "Vrata" : (around.includes("prozor") ? "Prozor" : "Otvor");
    out.push({naziv, wmm, hmm, kom, tip});
  }
  return out;
}

async function ucitaj(el){
  const f = el.files && el.files[0];
  if(!f) return;
  const info = document.getElementById("info");
  info.textContent = "Čitam ponudu…";
  try{
    let text = "";
    if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
      if(!window.pdfjsLib) throw new Error("PDF čitač nije učitan");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const c = await page.getTextContent();
        text += c.items.map(x=>x.str).join(" ") + "\n";
      }
    } else {
      info.textContent = "Za sliku zalijepi dimenzije ili koristi PDF ponude.";
      return;
    }
    const found = parsaj(text);
    if(!found.length){
      info.className = "warn";
      info.textContent = "Nisam našao …x… mm. Ponuda mora imati dimenzije tipa 2040x890 mm.";
      return;
    }
    otvori = found;
    info.className = "ok";
    info.textContent = "Učitano otvora: " + found.length + ". Klikni rad u izborniku.";
    crtaj();
  }catch(e){
    info.className = "warn";
    info.textContent = "Greška: " + (e.message||e);
  }
}

function dodaj(){
  otvori.push({naziv:"Otvor", wmm:"", hmm:"", kom:1, tip:"prozor"});
  crtaj(true);
}
function brisi(i){ otvori.splice(i,1); crtaj(true); }
function setO(i,k,val){ otvori[i][k]=val; crtaj(false); }
function setCijena(id, val){ cijena[id]=val; crtajPonudu(); }

function crtaj(rebuild){
  if(rebuild !== false){
    const lista = document.getElementById("lista");
    if(lista){
      lista.innerHTML = otvori.map((o,i)=>`
        <div class="item">
          <div style="display:flex;justify-content:space-between"><b>${o.naziv||"Otvor"} ${o.wmm||"?"}×${o.hmm||"?"} mm</b>
            <button class="btn-del" onclick="brisi(${i})">Obriši</button></div>
          <div class="row2">
            <div><label>Širina mm</label><input value="${o.wmm}" onchange="setO(${i},'wmm',this.value)"></div>
            <div><label>Visina mm</label><input value="${o.hmm}" onchange="setO(${i},'hmm',this.value)"></div>
          </div>
          <div class="row2">
            <div><label>Kom</label><input type="number" value="${o.kom}" onchange="setO(${i},'kom',this.value)"></div>
            <div><label>Vrsta</label>
              <select onchange="setO(${i},'tip',this.value)">
                <option value="prozor" ${o.tip==="prozor"?"selected":""}>Prozor (klupica)</option>
                <option value="pod" ${o.tip==="pod"?"selected":""}>Do poda / balkon / vrata</option>
              </select>
            </div>
          </div>
        </div>`).join("") || '<div class="ok">Još nema otvora.</div>';
    }
    document.getElementById("radovi").innerHTML = RADOVI.map(r=>{
      const on = !!uklj[r.id];
      const dm = metara(r);
      return `<div class="rad">
        <label class="chk"><input type="checkbox" ${on?"checked":""} onchange="uklj['${r.id}']=this.checked;crtaj(true)"> ${r.naziv}</label>
        <div class="ok">${r.kako}</div>
        <div class="met" id="m-${r.id}">${fmt(dm)} m′</div>
        <label>Cijena € / m′</label>
        <input type="number" step="0.01" inputmode="decimal" value="${cijena[r.id]||""}" oninput="setCijena('${r.id}', this.value)">
      </div>`;
    }).join("");
  } else {
    RADOVI.forEach(r=>{
      const el = document.getElementById("m-"+r.id);
      if(el) el.textContent = fmt(metara(r)) + " m′";
    });
  }
  crtajPonudu();
}

function crtajPonudu(){
  const rows = RADOVI.filter(r=>uklj[r.id]).map(r=>{
    const dm = metara(r);
    const c = Number(cijena[r.id])||0;
    return {naziv:r.naziv, kako:r.kako, dm, c, uk: +(dm*c).toFixed(2)};
  });
  const sub = +rows.reduce((a,x)=>a+x.uk,0).toFixed(2);
  const pdv = +(sub*0.25).toFixed(2);
  const tot = +(sub+pdv).toFixed(2);

  document.getElementById("sheet").innerHTML = `
    <div class="memo"><img src="${LOGO}" alt=""></div>
    <div class="top">
      <div><h2>PONUDA</h2><div class="tl">RAL montaža i prateći radovi</div>
        <div style="margin-top:8px;font-size:11px"><b>Kupac:</b> ${v("kupac")||"________________"}</div>
      </div>
      <div style="border:.5px solid #aaa;font-size:9px">
        <div style="padding:5px 8px;border-bottom:.5px solid #aaa">BROJ: <b>${v("broj")||"—"}</b></div>
        <div style="padding:5px 8px">DATUM: <b>${v("datum")}</b></div>
      </div>
    </div>
    <table>
      <thead><tr><th>R.BR.</th><th>RAD</th><th class="r">m′</th><th class="r">€ / m′</th><th class="r">UKUPNO</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.naziv}<div style="color:#555">${r.kako}</div></td>
        <td class="r">${fmt(r.dm)}</td><td class="r">${fmt(r.c)}</td><td class="r">${fmt(r.uk)}</td></tr>`).join("")
        || `<tr><td colspan="5">Uključi rad u izborniku lijevo.</td></tr>`}</tbody>
    </table>
    <div class="totals">
      <div><span>Bez PDV-a</span><b>${fmt(sub)} €</b></div>
      <div><span>PDV 25%</span><b>${fmt(pdv)} €</b></div>
      <div class="grand"><span>UKUPNO</span><span>${fmt(tot)} €</span></div>
    </div>
    <div class="nap">Cijene €/m′ upisuje naručitelj. Dimenzije iz ponude su u mm.</div>
  `;
}

document.getElementById("datum").value = danas();
document.getElementById("broj").value = "R-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-001";
crtaj();
</script>
